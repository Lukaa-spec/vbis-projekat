<div class="container">
  <div class="header">
    <h2>Studenti koji traže posao</h2>
    <button (click)="fetchStudents()" [disabled]="loading">Pretraži</button>
  </div>

  <div class="list">
    <div *ngFor="let s of students" class="card">
      <div class="card-main" (click)="toggleDetails(s)">
        <span>👤</span>
        <div class="info">
          <h3>{{ s.username || s._key }}</h3>
          <p>{{ s.email }}</p>
        </div>
        <span class="badge">Traži posao</span>
      </div>

      <div class="details" *ngIf="selectedStudent === s">
        <hr>
        <div class="skills-box">
          <strong>Glavne veštine:</strong>
          <span *ngFor="let sk of s.skills" class="tag">{{ sk }}</span>
        </div>

        <table class="exam-table">
          <thead>
            <tr>
              <th>Predmet</th>
              <th>Ocena</th>
              <th>Nivoi veština</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let ex of s.examHistory">
              <td>{{ ex.subject?.name }}</td>
              <td><span class="grade">{{ ex.grade }}</span></td>
              <td>
                <div *ngFor="let st of ex.subject?.skillTaught">
                  {{ st.skill?.name }}: 
                  <b [ngClass]="'lvl-' + st.levelOfReadiness">{{ st.levelOfReadiness }}</b>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div *ngIf="students.length === 0 && !loading" class="empty">
    Kliknite na dugme za pretragu.
  </div>
</div>
